<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>39-mavzu: Solishtirma erish issiqligi</title>
<style>
:root{--bg:#f3f8fd;--card:#fff;--tx:#14212e;--mu:#5b6b7b;--ice:#2f80ed;--heat:#e8760c;--liq:#2bb4e6;--bd:#d3e0ec;--ok:#1e9e5a;--no:#d93636;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#16222f;--tx:#e8eff6;--mu:#93a4b5;--ice:#5a9dff;--heat:#ff9a3d;--liq:#5fd0f5;--bd:#2a3b4c}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#16222f;--tx:#e8eff6;--mu:#93a4b5;--ice:#5a9dff;--heat:#ff9a3d;--liq:#5fd0f5;--bd:#2a3b4c}
html,body{height:auto}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
header h1{font-size:17px;margin:0;line-height:1.25}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
nav button.on{background:var(--ice);color:#fff;border-color:var(--ice)}
main{max-width:820px;margin:0 auto;padding:12px}
h2{font-size:20px;margin:6px 0 12px;color:var(--ice)}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;overflow-x:auto}
.formula{background:var(--card);border:2px solid var(--heat);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;font-size:20px;font-weight:700;color:var(--heat);overflow-x:auto}
canvas{display:block;width:100%;height:230px;background:var(--bg);border-radius:12px;margin:8px 0}
button.b,.btns button,.card>button,.card button.b{background:var(--ice);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0;min-height:48px}
.btns{display:flex;flex-wrap:wrap}.btns button:nth-child(1){background:var(--heat)}.btns button:nth-child(2){background:var(--mu)}
label{display:block;margin:8px 0;font-size:15px}input[type=range]{width:100%;height:36px;accent-color:var(--ice)}
select,input[type=number]{font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;max-width:220px}
.out{font-weight:600;color:var(--liq);min-height:26px}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px;text-align:center}th{background:var(--bg)}
.step{padding:8px 10px;margin:6px 0;border-left:4px solid var(--heat);background:var(--bg);border-radius:8px}
.res{margin-top:8px;font-weight:700}.good{color:var(--ok)}.bad{color:var(--no)}
.q{margin-bottom:12px}.q button{display:block;width:100%;text-align:left;margin:6px 0;padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.q button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.q button.no{background:var(--no);border-color:var(--no);color:#fff}
details{margin:6px 0 12px}summary{cursor:pointer;color:var(--ice);font-weight:600;padding:6px 0}
#vcv{height:auto}
.vbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.vbar button{border:0;border-radius:12px;padding:10px 16px;background:var(--ice);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.vbar button.alt{background:var(--bd);color:var(--tx)}
.vbar input[type=range]{flex:1;min-width:140px}
.vbar label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.vbar select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.vnote{font-size:13px;color:var(--mu);margin:6px 0 0}
</style></head><body>
<header><h1>39-mavzu. Moddaning solishtirma erish issiqligi. Amorf jismlarning erishi va qotishi</h1><button class="b" id="th" style="margin:0">🌓</button></header>
<nav id="nav"></nav><main id="main"></main>
<div style="max-width:900px;margin:0 auto;padding:0 12px 24px"><div class="vid" id="vid" style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px"><h2>🎬 Video dars (5 daqiqa, ovozli sharh bilan)</h2>
<canvas id="vcv" width="960" height="540" aria-label="Video dars"></canvas>
<div class="vbar"><button class="" id="vpp">▶ Boshlash</button><button class=" alt" id="vrs" aria-label="Boshidan boshlash">⟲</button><input type="range" id="vsl" min="0" max="300" step="0.1" value="0" aria-label="Video vaqti"><span id="vtm">0:00 / 5:00</span></div>
<div class="vbar"><label><input type="checkbox" id="vmu"> Ovozsiz</label><label>Ovoz tezligi <select id="vrt" aria-label="Ovoz tezligi"><option value="0.85">Sekin</option><option value="1" selected>Oddiy</option><option value="1.15">Tez</option></select></label></div>
<p class="vnote" id="vnt"></p></div></div>
<script>
const $=s=>document.querySelector(s),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),val=id=>+$('#'+id).value;
const fmt=n=>{let[a,b]=(+n.toFixed(2)+'').split('.');a=a.replace(/\B(?=(\d{3})+$)/g,' ');return b?a+','+b:a};
const rnd=(i,j)=>{const x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x)};
const M=[["Muz",0,3.4e5],["Alyuminiy",660,3.9e5],["Mis",1085,2.1e5],["Qo'rg'oshin",327,0.25e5],["Temir",1539,2.7e5]];
function setup(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.w=r.width;c.h=r.height;return c}
function txt(c,s,x,y,sz,col,al){c.font='600 '+sz+'px system-ui,sans-serif';c.fillStyle=col;c.textAlign=al||'left';c.fillText(s,x,y)}
function lat(c,x,y,cols,rows,sp,amp,d,t,col){c.fillStyle=col;for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const a=rnd(i,j)*6.28,b=rnd(j,i+9)*6.28,dx=(rnd(i+3,j)-.5)*sp*.9*d+Math.sin(t/120*(1+rnd(i,j))+a)*amp,dy=(rnd(i,j+5)-.5)*sp*.9*d+Math.cos(t/130*(1+rnd(j,i))+b)*amp;c.beginPath();c.arc(x+i*sp+dx,y+j*sp+dy,sp*.28,0,6.283);c.fill()}}
function graph(c,x,y,w,h,Tm,p,k,col,ttl){const a=Tm-40,b=Tm+40,f=u=>k?(u<.3?a+(Tm-a)*u/.3:u<.7?Tm:Tm+(b-Tm)*(u-.7)/.3):a+(b-a)*(u+.1*Math.sin(6.283*u));
const X=u=>x+u*w,Y=T=>y+h-(T-a)/(b-a)*h;c.strokeStyle=css('--mu');c.lineWidth=1;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w,y+h);c.stroke();
txt(c,'t, °C',x+4,y-6,11,css('--mu'));txt(c,'τ',x+w-4,y+h-5,13,css('--mu'),'right');
if(k){c.setLineDash([4,4]);c.beginPath();c.moveTo(x,Y(Tm));c.lineTo(x+w,Y(Tm));c.stroke();c.setLineDash([]);txt(c,Tm+' °C',x+6,Y(Tm)-5,11,col)}
c.strokeStyle=col;c.lineWidth=3;c.beginPath();for(let i=0;i<=100*p;i++){const u=Math.min(i/100,p);i?c.lineTo(X(u),Y(f(u))):c.moveTo(X(u),Y(f(u)))}c.lineTo(X(p),Y(f(p)));c.stroke();
c.fillStyle=css('--heat');c.beginPath();c.arc(X(p),Y(f(p)),5,0,6.283);c.fill();if(ttl)txt(c,ttl,x+w/2,y-6,12,css('--tx'),'center');
return k?(p<.3?'qattiq':p<.7?'erish':'suyuq'):'asta-sekin yumshaydi'}
const rng=(id,l,mn,mx,st,v,u)=>`<label>${l}: <b id="${id}v">${v}</b> ${u}<input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`;
const sel=id=>`<label>Modda:<br><select id="${id}">${M.map((m,i)=>`<option value="${i}">${m[0]}</option>`).join('')}</select></label>`;
const bar=(c,x,y,w,h,f,col)=>{c.strokeStyle=css('--mu');c.lineWidth=1;c.strokeRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*Math.min(1,f),h)};
function draw2(c,p,Tm,t){const gw=c.w*.6;const ph=graph(c,40,26,gw-40,c.h-60,Tm,p,true,css('--heat'));const d=p<.3?0:p<.7?(p-.3)/.4:1,am=p<.3?1+p*10:p<.7?3:3+(p-.7)*7,sp=16,cols=Math.floor((c.w*.36-6)/sp);
lat(c,c.w*.64,c.h/2-45,cols,6,sp,am,d,t,d<.5?css('--ice'):css('--liq'));txt(c,ph==='erish'?'Erish (t = const)':ph==='qattiq'?'Qattiq':'Suyuq',c.w*.64,c.h-14,13,css('--tx'));return ph}
function draw4(c,m,i,lab){const L=M[i][2],Q=L*m;bar(c,20,30,c.w-40,26,Q/3.9e6,css('--heat'));txt(c,'Energiya shkalasi',20,22,12,css('--mu'));const s=14+m*6;c.fillStyle=css('--ice');c.globalAlpha=.85;c.fillRect(c.w/2-s/2,c.h-s-20,s,s);c.globalAlpha=1;
txt(c,lab+'m = '+fmt(m)+' kg',20,c.h-8,14,css('--tx'));txt(c,'Q = '+fmt(Q)+' J',c.w-20,c.h-8,15,css('--heat'),'right');txt(c,'Q = λ·m',c.w/2,100,18,css('--tx'),'center');return`${M[i][0]}: λ = ${fmt(L)} J/kg, Q = ${fmt(Q)} J = ${fmt(Q/1000)} kJ`}
const E=[3,3,3,3];
const S=[
{t:"1-reja. Erish va qotish jarayonlari",
th:"<p><b>Erish</b> — moddaning qattiq holatdan suyuq holatga o'tishi. <b>Qotish</b> — suyuq holatdan qattiq holatga o'tishi.</p><p>Qizdirilganda molekulalar tez tebranadi, o'zaro ta'sir kuchlari zaiflashadi va kristall panjara buziladi. Sovitilganda molekulalar sekinlashadi va yana tartibli joylashadi.</p>",
f:"qattiq ⇄ suyuq",ex:"Issiq choyga tushgan muz bo'lagi erib suvga aylanadi, ayozda ko'lmak suvi muzlaydi.",
ctl:rng('s0t',"Temperatura",-30,30,1,-20,"°C"),
sim:c=>{const T=val('s0t'),d=T<0?0:T==0?.5:1,sp=22,cols=Math.floor((c.w-30)/sp);lat(c,(c.w-(cols-1)*sp)/2,(c.h-5*sp)/2,cols,6,sp,1+(T+30)/12,d,performance.now(),d<.5?css('--ice'):css('--liq'));return T<0?`${T} °C: qattiq (muz), panjara tartibli`:T==0?'0 °C: erish — panjara buzilmoqda':`${T} °C: suyuq (suv), panjara buzilgan`},
an:(c,p,t)=>{const d=1-Math.abs(2*p-1),sp=22,cols=Math.floor((c.w-30)/sp);lat(c,(c.w-(cols-1)*sp)/2,(c.h-5*sp)/2,cols,6,sp,2.5,d,t,d>.5?css('--liq'):css('--ice'));txt(c,p<.5?'Erish: muz → suv':'Qotish: suv → muz',c.w/2,22,16,css('--tx'),'center')},dur:7000,
pq:"Suv normal sharoitda necha °C da qotadi?",pu:"°C",ans:0},
{t:"2-reja. Kristall jismlarning erishi va qotishi",
th:`<p>Kristall jismlarning erish temperaturasi aniq va doimiy. Qotish temperaturasi erish temperaturasiga teng.</p><p>Erish davomida temperatura o'zgarmaydi: energiya kristall panjarani buzishga sarflanadi.</p><table><tr><th>Modda</th><th>t<sub>erish</sub>, °C</th></tr>${M.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table>`,
f:"t<sub>erish</sub> = t<sub>qotish</sub>",ex:"Muz va suv aralashmasi erish tugaguncha 0 °C da qoladi.",
ctl:sel('s1m')+rng('s1p',"Jarayon (τ)",0,100,1,50,"%"),
sim:c=>{const i=val('s1m'),p=val('s1p')/100,ph=draw2(c,p,M[i][1],performance.now());return`${M[i][0]}: t = ${M[i][1]} °C — ${ph}`},
an:(c,p,t)=>draw2(c,p,0,t),dur:9000,pq:"Qo'rg'oshin necha °C da qotadi?",pu:"°C",ans:327},
{t:"3-reja. Amorf jismlarning erishi va qotishi",
th:"<p>Amorf jismlar (shisha, smola, mum, plastmassa, asfalt) aniq erish temperaturasiga ega emas. Qizdirilganda asta-sekin yumshaydi, quyuqligi kamayadi; qotishda ham asta-sekin qotadi. Molekulalari tartibsiz joylashgan.</p>",
f:"t–τ grafikda gorizontal qism yo'q",ex:"Shisha puflash, asfaltning issiqda yumshashi, sham mumining yumshab oqishi.",
ctl:rng('s2p',"Qizdirish (τ)",0,100,1,60,"%"),
sim:c=>{const p=val('s2p')/100,w=(c.w-50)/2;const a=graph(c,24,28,w,c.h-56,100,p,true,css('--ice'),'Kristall'),b=graph(c,c.w/2+10,28,w,c.h-56,100,p,false,css('--heat'),'Amorf');return`Kristall: ${a} · Amorf: ${b}`},
an:(c,p,t)=>{const w0=c.w*.4,cx=c.w/2,hh=110*(1-.7*p),ww=w0*(1+.5*p),y0=c.h-20-hh;c.fillStyle=css('--liq');c.globalAlpha=.35;c.fillRect(cx-ww/2,y0,ww,hh);c.fillStyle=css('--heat');c.globalAlpha=p*.5;c.fillRect(cx-ww/2,y0,ww,hh);c.globalAlpha=1;c.fillStyle=css('--tx');for(let k=0;k<60;k++){const a=rnd(k,1)*6.28;c.beginPath();c.arc(cx-ww/2+rnd(k,2)*ww+Math.sin(t/100+a)*(1+3*p),y0+rnd(k,3)*hh+Math.cos(t/110+a)*(1+3*p),3,0,6.283);c.fill()}txt(c,'Shisha yumshab oqmoqda — tartibsiz molekulalar',cx,22,13,css('--tx'),'center')},dur:8000,
pq:"Quyidagilardan nechtasi amorf jism: shisha, mis, mum, muz, asfalt?",pu:"ta",ans:3},
{t:"4-reja. Solishtirma erish issiqligi",
th:`<p>Massasi 1 kg bo'lgan kristall jismni erish temperaturasida to'liq suyuqlikka aylantirish uchun zarur issiqlik miqdori <b>solishtirma erish issiqligi</b> deyiladi. Belgisi λ (lambda), birligi J/kg (kJ/kg). Qotishda xuddi shuncha issiqlik ajralib chiqadi.</p><table><tr><th>Modda</th><th>λ, J/kg</th></tr>${M.map(m=>`<tr><td>${m[0]}</td><td>${fmt(m[2])}</td></tr>`).join('')}</table>`,
f:"λ = Q / m &nbsp;[J/kg]",ex:"Muzning λ i katta: shuning uchun muz sharbatni uzoq sovuq saqlaydi.",
ctl:sel('s3m')+rng('s3k',"Massa",0.1,10,0.1,2,"kg"),
sim:c=>draw4(c,val('s3k'),val('s3m'),''),an:(c,p)=>{draw4(c,p*10,0,'Muz: ')},dur:8000,pq:"Muzning λ = 3,4·10⁵ J/kg. 3 kg muzni eritish uchun Q necha kJ kerak?",pu:"kJ",ans:1020},
{t:"5-reja. Q = λ·m formulasi va masalalar",
th:"<p>Erish temperaturasidagi jismni to'liq eritish uchun kerak bo'lgan issiqlik λ va massaga to'g'ri proporsional. Birliklar: Q — J, λ — J/kg, m — kg.</p>",
f:"Q = λ·m &nbsp; λ = Q/m &nbsp; m = Q/λ",ex:"Zavodda 5 kg qo'rg'oshinni eritish uchun hisoblangan issiqlik sarflanadi.",
ctl:rng('s4m',"Massa m",0.1,10,0.1,2,"kg")+rng('s4l',"λ (×10⁵ J/kg)",0.1,5,0.05,3.4,"·10⁵"),
sim:c=>{const m=val('s4m'),l=val('s4l'),Q=l*1e5*m;bar(c,20,60,c.w-40,28,Q/5e6,css('--heat'));txt(c,'Q = λ·m = '+fmt(l*1e5)+' · '+fmt(m),c.w/2,40,15,css('--tx'),'center');txt(c,'Q = '+fmt(Q)+' J',c.w/2,140,24,css('--heat'),'center');return`Q = ${fmt(Q/1000)} kJ`},
an:(c,p)=>{const s=60*(1-p)+4;c.fillStyle=css('--ice');c.fillRect(c.w/2-s/2,c.h-80-s+30,s,s);c.fillStyle=css('--liq');c.fillRect(c.w/2-60,c.h-50,120,10+40*p*.5);const l=['Berilgan: m = 2 kg, λ = 3,4·10⁵ J/kg','Formula: Q = λ·m','Hisoblash: Q = 3,4·10⁵ · 2','Javob: Q = 6,8·10⁵ J'];txt(c,l[Math.min(3,Math.floor(p*4))],c.w/2,30,15,css('--tx'),'center')},dur:8000,
extra:`<div class="card"><h3>🧮 Bosqichma-bosqich masalalar</h3><div class="btns" id="tk"></div><div id="stp"></div><button class="b" id="nx">Keyingi qadam</button></div>`,
pq:"Q = 6,8·10⁵ J, λ = 3,4·10⁵ J/kg. Massa m necha kg?",pu:"kg",ans:2},
{t:"6-reja. Tabiat va texnikada qo'llanilishi + aralash masalalar",
th:"<p>Metallurgiyada quyma tayyorlash, muzlik va qorning erishi, muzxona, metallarni payvandlash, ayozli kunlarda idishlarga suv qo'yish — hammasi erish/qotishga bog'liq.</p><p><b>Nima uchun bahorda qor erishida havo sovuq bo'ladi?</b> Qor erishi uchun atrofdan issiqlik yutiladi, shuning uchun havo soviydi.</p>",
f:"Q = c·m·Δt + λ·m + c<sub>suv</sub>·m·Δt",ex:"Ayozda sabzavot yonida suv idishi qo'yilsa, suv qotganda issiqlik ajralib sabzavotni muzlashdan saqlaydi.",
ctl:rng('s5m',"Muz massasi (−20 °C → suv 20 °C)",0.5,5,0.1,1,"kg"),
sim:c=>{const m=val('s5m'),q=[2100*m*20,3.4e5*m,4200*m*20],cl=[css('--ice'),css('--heat'),css('--liq')],nm=['Muzni qizdirish','Erish','Suvni qizdirish'],mx=3.4e5*5+84000*5+42000*5;q.forEach((v,i)=>{bar(c,20,34+i*52,c.w-40,24,v/mx,cl[i]);txt(c,nm[i]+': '+fmt(v/1000)+' kJ',20,28+i*52,13,css('--tx'))});return'Jami: Q = '+fmt((q[0]+q[1]+q[2])/1000)+' kJ'},
an:(c,p)=>{const m=val('s5m'),q1=42000*m,q2=3.4e5*m,q3=84000*m,tot=q1+q2+q3;let T,Q,ice;if(p<.3){T=-20+20*p/.3;Q=q1*p/.3;ice=1}else if(p<.7){T=0;Q=q1+q2*(p-.3)/.4;ice=1-(p-.3)/.4}else{T=20*(p-.7)/.3;Q=q1+q2+q3*(p-.7)/.3;ice=0}
c.fillStyle=css('--liq');c.fillRect(30,c.h-30-100*(1-ice),90,100*(1-ice));c.fillStyle=css('--ice');c.fillRect(30,c.h-30-100*(1-ice)-100*ice,90,100*ice);txt(c,'t = '+fmt(T)+' °C',150,60,22,css('--tx'));txt(c,'Q = '+fmt(Q/1000)+' kJ',150,100,22,css('--heat'));bar(c,150,125,c.w-170,22,Q/tot,css('--heat'));txt(c,p<.3?'Muz qizmoqda':p<.7?'Muz erimoqda (t = 0 °C)':'Suv qizmoqda',150,175,15,css('--mu'))},dur:10000,
extra:`<div class="card"><h3>📝 Aralash masalalar</h3>
<p><b>a)</b> 2 kg muz −10 °C dan 0 °C gacha qizdirilib, so'ng eritiladi (c = 2100 J/(kg·°C), λ = 3,4·10⁵). Q = ?</p><details><summary>Yechim</summary>Q₁ = 2100·2·10 = 42 000 J; Q₂ = 3,4·10⁵·2 = 680 000 J; Q = 722 000 J = 722 kJ</details>
<p><b>b)</b> Muzni eritishga 1,02·10⁶ J sarflandi. Massa?</p><details><summary>Yechim</summary>m = Q/λ = 1,02·10⁶ / 3,4·10⁵ = 3 kg</details>
