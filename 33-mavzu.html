<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>33-mavzu: Masalalar yechish</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#d5dbe8;--w:rgba(37,140,255,.55);--hg:#8b94a3}
:root[data-theme=dark]{--bg:#0f1420;--card:#1a2133;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#6ea0ff;--ok:#34d399;--bad:#f87171;--bd:#33405c;--w:rgba(70,160,255,.6);--hg:#aab3c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
h1{font-size:18px;margin:0}
#th{font-size:22px;background:var(--card);border:1px solid var(--bd);border-radius:12px;width:48px;height:48px;cursor:pointer}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
#tabs button{flex:none;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:0 14px 40px}
section{display:none;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
section.on{display:block}
h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:18px 0 8px;color:var(--ac)}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.gf{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg)}
.box ul{margin:6px 0 0;padding-left:18px}
.st{border-left:4px solid var(--ac);background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;cursor:pointer;margin:6px 6px 6px 0}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.sl{margin:8px 0}.sl label{display:flex;justify-content:space-between;font-size:15px}
input[type=range]{width:100%;height:36px;accent-color:var(--ac)}
.res{background:var(--bg);border:2px solid var(--ac);border-radius:12px;padding:10px;font-weight:600;margin:8px 0}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);display:block}
input[type=text]{min-height:48px;width:100%;max-width:220px;font-size:17px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.fb{margin-top:6px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
.q{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.o{display:block;width:100%;text-align:left;min-height:48px;margin:6px 0;padding:8px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.o.ok{border-color:var(--ok);background:rgba(22,163,74,.2);color:var(--tx)}
.o.bad{border-color:var(--bad);background:rgba(220,38,38,.2);color:var(--tx)}
#vcv{height:auto}
.vbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.vbar button{border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.vbar button.alt{background:var(--bd);color:var(--tx)}
.vbar input[type=range]{flex:1;min-width:140px}
.vbar label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.vbar select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.vnote{font-size:13px;color:var(--mu);margin:6px 0 0}
</style>
</head>
<body>
<header><h1>33-mavzu. Masalalar yechish<br><small style="font-weight:400;color:var(--mu)">Hoʻllash va kapillyar hodisalar · 9-sinf</small></h1><button id="th" aria-label="Mavzu">🌙</button></header>
<div id="tabs"></div>
<main id="main"></main>
<main id="vmain"><div class="vid" id="vid" style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0"><h2>🎬 Video dars (5 daqiqa, ovozli sharh bilan)</h2>
<canvas id="vcv" width="960" height="540" aria-label="Video dars"></canvas>
<div class="vbar"><button class="" id="vpp">▶ Boshlash</button><button class=" alt" id="vrs" aria-label="Boshidan boshlash">⟲</button><input type="range" id="vsl" min="0" max="300" step="0.1" value="0" aria-label="Video vaqti"><span id="vtm">0:00 / 5:00</span></div>
<div class="vbar"><label><input type="checkbox" id="vmu"> Ovozsiz</label><label>Ovoz tezligi <select id="vrt" aria-label="Ovoz tezligi"><option value="0.85">Sekin</option><option value="1" selected>Oddiy</option><option value="1.15">Tez</option></select></label></div>
<p class="vnote" id="vnt"></p></div></main>
<script>
/* ===== Yordamchilar ===== */
const F=(x,d=2)=>(+x).toFixed(d).replace('.',','); // vergulli format
const RAD=Math.PI/180, SG=0.072, RW=1000, G=10;
const $=(s,e=document)=>e.querySelector(s);

/* ===== Chizish funksiyalari ===== */
// Naycha: tubi (bot), suyuqlik sathi (lvl), menisk ishorasi (sign: +botiq, -qavariq)
function tube(c,C,x,w,top,bot,lvl,col,sign){
  const md=Math.min(w/2,7)*sign;
  c.fillStyle=C.card;c.fillRect(x-w/2,top,w,bot-top);
  c.fillStyle=col;c.beginPath();c.moveTo(x-w/2,lvl);
  c.quadraticCurveTo(x,lvl+2*md,x+w/2,lvl);c.lineTo(x+w/2,bot);c.lineTo(x-w/2,bot);c.fill();
  c.strokeStyle=C.tx;c.lineWidth=2;c.beginPath();
  c.moveTo(x-w/2,top);c.lineTo(x-w/2,bot);c.moveTo(x+w/2,top);c.lineTo(x+w/2,bot);c.stroke();
}
function ruler(c,C,x,base,sc,k0,k1){
  c.strokeStyle=C.tx;c.fillStyle=C.tx;c.lineWidth=1;c.font='10px sans-serif';c.textAlign='right';
  c.beginPath();c.moveTo(x,base-k1*sc);c.lineTo(x,base-k0*sc);c.stroke();
  for(let k=k0;k<=k1;k++){const y=base-k*sc;c.beginPath();c.moveTo(x-6,y);c.lineTo(x,y);c.stroke();c.fillText(k,x-8,y+3);}
  c.textAlign='left';
}
function dash(c,C,x1,x2,y,col){c.save();c.setLineDash([4,4]);c.strokeStyle=col||C.ac;c.lineWidth=1.5;c.beginPath();c.moveTo(x1,y);c.lineTo(x2,y);c.stroke();c.restore();}
function txt(c,C,s,x,y,col,al,f){c.fillStyle=col||C.tx;c.font=f||'bold 13px sans-serif';c.textAlign=al||'left';c.fillText(s,x,y);c.textAlign='left';}

/* ===== MASALALAR (ma'lumotlar + hisob + animatsiya) ===== */
const P=[
{ // 1
 t:'1-masala. Suvning kapillyar naychada koʻtarilishi',
 q:'Radiusi r = 0,5 mm boʻlgan shisha kapillyar naycha suvga tushirildi. Suv naychada qanday balandlikka koʻtariladi? (σ = 0,072 N/m, ρ = 1000 kg/m³, g = 10 m/s², θ = 0°)',
 find:'h = ? (m va sm)',
 sl:[{k:'r',l:'Radius r',min:.1,max:2,step:.05,val:.5,u:'mm'}],
 h:v=>2*SG/(RW*G*v.r/1000),
 g:v=>[`r = ${F(v.r)} mm = ${F(v.r/1000,5)} m`,'σ = 0,072 N/m','ρ = 1000 kg/m³','g = 10 m/s²','θ = 0° (cosθ = 1)'],
 s(v){const r=v.r/1000,h=this.h(v);return[
  'Formula: h = 2σcosθ / (ρgr). θ = 0° boʻlgani uchun cosθ = 1.',
  `r ni SI ga oʻtkazamiz: r = ${F(v.r)} mm = ${F(r,5)} m.`,
  `Qiymatlarni qoʻyamiz: h = 2·0,072·1 / (1000·10·${F(r,5)}).`,
  `Surat: 2σ = 0,144 N/m; maxraj ρgr = ${F(1e4*r,3)} N/m².`,
  `Natija: h = ${F(h,4)} m ≈ ${F(h*100)} sm.`]},
 res(v){const h=this.h(v);return`h = ${F(h,4)} m = ${F(h*100)} sm`},
 draw(c,C,p,v){const h=this.h(v)*100,base=190,sc=10,w=10+v.r*20,lvl=base-h*sc*p;
  c.fillStyle=C.w;c.fillRect(0,base,360,50);
  tube(c,C,210,w,15,225,lvl,C.w,1);ruler(c,C,110,base,sc,0,14);
  dash(c,C,110,210-w/2,lvl);txt(c,C,`h = ${F(h*p)} sm`,225+w/2,(lvl+base)/2,C.ac);},
 own:{t:'Mustaqil masala: r = 0,25 mm boʻlgan naychada suv necha sm koʻtariladi?',a:5.76,u:'sm'}
},
{ // 2
 t:'2-masala. Simobning kapillyar naychada pasayishi',
 q:'Radiusi r = 1 mm boʻlgan shisha naycha simobga tushirildi. Simob–shisha chegaraviy burchagi θ = 138°, σ = 0,47 N/m, ρ = 13600 kg/m³. Simob sathi qanday oʻzgaradi? (g = 10 m/s²)',
 find:'h = ? (m va mm), ishorasi nimani bildiradi?',
 sl:[{k:'th',l:'Burchak θ',min:90,max:180,step:1,val:138,u:'°'},{k:'r',l:'Radius r',min:.3,max:2,step:.1,val:1,u:'mm'}],
 h:v=>2*.47*Math.cos(v.th*RAD)/(13600*G*v.r/1000),
 g:v=>[`r = ${F(v.r)} mm = ${F(v.r/1000,5)} m`,'σ = 0,47 N/m','ρ = 13600 kg/m³','g = 10 m/s²',`θ = ${v.th}° (cosθ = ${F(Math.cos(v.th*RAD),3)})`],
 s(v){const r=v.r/1000,c=Math.cos(v.th*RAD),h=this.h(v);return[
  'Formula: h = 2σcosθ / (ρgr).',
  `cos ${v.th}° = ${F(c,3)}${c<0?' (manfiy — simob hoʻllamaydi)':''}.`,
  `h = 2·0,47·(${F(c,3)}) / (13600·10·${F(r,5)}) = ${F(2*.47*c,4)} / ${F(13600*G*r,3)}.`,
  `Natija: h = ${F(h,5)} m = ${F(h*1000)} mm.`,
  h<0?`Manfiy ishora: simob sathi naychada ${F(-h*1000)} mm PASAYADI (menisk qavariq).`:`Musbat ishora: suyuqlik ${F(h*1000)} mm koʻtariladi.`]},
 res(v){const h=this.h(v);return`h = ${F(h*1000)} mm → ${h<0?'pasayadi':'koʻtariladi'}`},
 draw(c,C,p,v){const h=this.h(v)*100,base=80,sc=30,w=10+v.r*20,lvl=base-h*sc*p,sg=Math.cos(v.th*RAD)<0?-1:1;
  c.fillStyle=C.hg;c.fillRect(0,base,360,160);
  tube(c,C,210,w,10,225,lvl,C.hg,sg);ruler(c,C,110,base,sc,-3,2);
  dash(c,C,110,210-w/2,base,C.mu||C.tx);dash(c,C,110,210-w/2,lvl);
  txt(c,C,`h = ${F(h*p)} sm`,225+w/2,Math.min(lvl,200)+4,C.ac);txt(c,C,'boshlangʻich sath',120,base-4,C.tx,'left','10px sans-serif');},
 own:{t:'Mustaqil masala: r = 0,5 mm (θ = 138°) boʻlsa, simob necha mm pasayadi? (modul)',a:10.27,u:'mm'}
},
{ // 3
 t:'3-masala. Naycha radiusini topish',
 q:'Kapillyar naychada suv h = 3 sm balandlikka koʻtarildi. σ = 0,072 N/m, ρ = 1000 kg/m³, g = 10 m/s², θ = 0°. Naycha radiusi r qancha?',
 find:'r = ? (m va mm)',
 sl:[{k:'h',l:'Balandlik h',min:1,max:6,step:.5,val:3,u:'sm'}],
 r:v=>2*SG/(RW*G*v.h/100),
 g:v=>[`h = ${F(v.h)} sm = ${F(v.h/100,3)} m`,'σ = 0,072 N/m','ρ = 1000 kg/m³','g = 10 m/s²','θ = 0° (cosθ = 1)'],
 s(v){const r=this.r(v);return[
  'h = 2σcosθ/(ρgr) formuladan r ni ifodalaymiz: r = 2σcosθ / (ρgh).',
  `h = ${F(v.h)} sm = ${F(v.h/100,3)} m; cosθ = 1.`,
  `r = 2·0,072 / (1000·10·${F(v.h/100,3)}) = 0,144 / ${F(1e4*v.h/100,1)}.`,
  `Natija: r = ${F(r,6)} m = ${F(r*1000)} mm.`]},
 res(v){const r=this.r(v);return`r = ${F(r,5)} m = ${F(r*1000)} mm`},
 draw(c,C,p,v){const r=this.r(v)*1000,h=v.h,sc=70/h,base=190;
  c.fillStyle=C.w;c.fillRect(0,base,360,24);
  c.fillStyle='rgba(37,99,235,.15)';c.fillRect(140,20,80,200);
  [.5,1,2].forEach((m,i)=>{const x=70+i*110,ri=r*m,hi=1.44/ri,w=6+Math.min(ri,3)*20;
   tube(c,C,x+(i==1?-0:0),w,30,205,base-hi*sc*p,C.w,1);
   txt(c,C,`r = ${F(ri)} mm`,x,235,i==1?C.ac:C.tx,'center');
   txt(c,C,`${F(hi*p,1)} sm`,x,22,C.tx,'center','11px sans-serif');});
  txt(c,C,'↑ kerakli naycha (h = '+F(h)+' sm)',180,230+6,C.ac,'center','10px sans-serif');},
 own:{t:'Mustaqil masala: suv 6 sm balandlikka koʻtarilgan. Naycha radiusi necha mm?',a:.24,u:'mm'}
},
{ // 4
 t:'4-masala. Sirt tarangligidan hosil boʻlgan kuch',
 q:'Sim ramkaning harakatchan tomoni uzunligi l = 5 sm. Sovunli suyuqlik pardasi ikki sirtli, σ = 0,04 N/m. Parda simga qanday F kuch bilan taʼsir qiladi? F = 2σl',
 find:'F = ? (N va mN)',
 sl:[{k:'l',l:'Uzunlik l',min:1,max:10,step:.5,val:5,u:'sm'},{k:'s',l:'Sirt taranglik σ',min:.02,max:.08,step:.005,val:.04,u:'N/m'}],
 f:v=>2*v.s*v.l/100,
 g:v=>[`l = ${F(v.l)} sm = ${F(v.l/100,3)} m`,`σ = ${F(v.s,3)} N/m`,'Parda ikki sirtli (n = 2)'],
 s(v){const f=this.f(v);return[
  'Parda ikki sirtli (old va orqa), shuning uchun F = 2σl.',
  `l = ${F(v.l)} sm = ${F(v.l/100,3)} m.`,
  `F = 2·${F(v.s,3)}·${F(v.l/100,3)}.`,
  `Natija: F = ${F(f,4)} N = ${F(f*1000)} mN.`]},
 res(v){const f=this.f(v);return`F = ${F(f,4)} N = ${F(f*1000)} mN`},
 draw(c,C,p,v){const L=v.l*12,cy=110,bx=110+p*120,f=this.f(v);
  c.fillStyle=C.w;c.fillRect(60,cy-L/2,bx-60,L);
  c.strokeStyle=C.tx;c.lineWidth=3;c.beginPath();c.moveTo(300,cy-L/2);c.lineTo(60,cy-L/2);c.lineTo(60,cy+L/2);c.lineTo(300,cy+L/2);c.stroke();
  c.strokeStyle=C.ac;c.lineWidth=6;c.beginPath();c.moveTo(bx,cy-L/2);c.lineTo(bx,cy+L/2);c.stroke();
  const al=20+f/.016*70;c.strokeStyle=C.bad;c.fillStyle=C.bad;c.lineWidth=4;
  c.beginPath();c.moveTo(bx,cy);c.lineTo(bx-al,cy);c.stroke();c.beginPath();c.moveTo(bx-al-9,cy);c.lineTo(bx-al,cy-6);c.lineTo(bx-al,cy+6);c.fill();
  txt(c,C,`F = 2σl = ${F(f*1000)} mN`,180,215,C.bad,'center');txt(c,C,`l = ${F(v.l)} sm`,bx+10,cy-L/2-6,C.ac);},
 own:{t:'Mustaqil masala: l = 8 sm, σ = 0,05 N/m (ikki sirtli parda). F necha mN?',a:8,u:'mN'}
},
{ // 5
 t:'5-masala. Hoʻllash va hoʻllamaslik',
 q:'Chegaraviy burchak suv–shisha uchun θ = 30°, simob–shisha uchun θ = 140°. cosθ ni hisoblab, menisk shaklini aniqlang. Slayder bilan burchakni oʻzgartiring.',
 find:'cosθ = ? Suyuqlik hoʻllaydimi yoki yoʻqmi?',
 sl:[{k:'a',l:'θ (suv–shisha)',min:5,max:175,step:1,val:30,u:'°'},{k:'b',l:'θ (simob–shisha)',min:5,max:175,step:1,val:140,u:'°'}],
 g:v=>[`θ₁ = ${v.a}° (suv–shisha)`,`θ₂ = ${v.b}° (simob–shisha)`,'Qoida: θ < 90° — hoʻllaydi; θ > 90° — hoʻllamaydi'],
 w:t=>t<90?'hoʻllaydi (botiq menisk, h > 0)':t>90?'hoʻllamaydi (qavariq menisk, h < 0)':'chegaraviy holat (menisk tekis)',
 s(v){const c1=Math.cos(v.a*RAD),c2=Math.cos(v.b*RAD);return[
  'cosθ ishorasi h ning ishorasini belgilaydi: h = 2σcosθ/(ρgr).',
  `cos ${v.a}° = ${F(c1,3)} → ${this.w(v.a)}.`,
  `cos ${v.b}° = ${F(c2,3)} → ${this.w(v.b)}.`,
  'Xulosa: cosθ > 0 boʻlsa suyuqlik naychada koʻtariladi, cosθ < 0 boʻlsa pasayadi.']},
 res(v){return`cos ${v.a}° = ${F(Math.cos(v.a*RAD),3)} · cos ${v.b}° = ${F(Math.cos(v.b*RAD),3)}`},
 draw(c,C,p,v){const y0=160;c.fillStyle=C.bd;c.fillRect(0,y0,360,40);
  [[90,v.a,C.w,'suv'],[270,v.b,C.hg,'simob']].forEach(([cx,t,col,nm])=>{
   const th=Math.max(5,90+(t-90)*p),R=55/Math.sin(th*RAD),cy=y0+R*Math.cos(th*RAD),a1=Math.atan2(y0-cy,55);
   c.fillStyle=col;c.beginPath();c.arc(cx,cy,R,a1,-Math.PI-a1,true);c.closePath();c.fill();
   c.strokeStyle=C.tx;c.lineWidth=2;c.stroke();
   txt(c,C,`${nm}: θ = ${F(th,0)}°`,cx,30,C.tx,'center');
   txt(c,C,`cosθ = ${F(Math.cos(th*RAD),2)}`,cx,50,C.ac,'center');
   txt(c,C,t<90?'HOʻLLAYDI':t>90?'HOʻLLAMAYDI':'90°',cx,222,t<90?C.ok:C.bad,'center');});},
 own:{t:'Mustaqil masala: θ = 120° boʻlsa, cosθ nimaga teng?',a:-.5,u:''}
},
{ // 6
 t:'6-masala. Oʻsimlik ildizi va tuproq kapillyarlari',
 q:'Tuproqdagi kapillyar naycha radiusi r = 0,02 mm = 20 mkm. Suv ildizgacha qancha balandlikka koʻtariladi? (σ = 0,072 N/m, ρ = 1000 kg/m³, g = 10 m/s², θ = 0°)',
 find:'h = ? (m va sm)',
 sl:[{k:'r',l:'Kapillyar radiusi r',min:5,max:100,step:1,val:20,u:'mkm'}],
 h:v=>2*SG/(RW*G*v.r*1e-6),
 g:v=>[`r = ${F(v.r,0)} mkm = ${F(v.r*1e-6,7)} m`,'σ = 0,072 N/m','ρ = 1000 kg/m³','g = 10 m/s²','θ = 0°'],
 s(v){const r=v.r*1e-6,h=this.h(v);return[
  'Formula: h = 2σcosθ/(ρgr), cosθ = 1.',
  `r = ${F(v.r,0)} mkm = ${F(r,7)} m.`,
  `h = 0,144 / (1000·10·${F(r,7)}) = 0,144 / ${F(1e4*r,4)}.`,
  `Natija: h = ${F(h,3)} m = ${F(h*100,1)} sm. Radius qancha kichik boʻlsa, suv shuncha baland chiqadi.`]},
 res(v){const h=this.h(v);return`h = ${F(h,3)} m = ${F(h*100,1)} sm`},
 draw(c,C,p,v){const h=this.h(v),hp=Math.min(150,h*150),cw=4+v.r*.12,tb=210,lvl=tb-hp*p;
  c.fillStyle=C.bg||'#fff';c.fillRect(0,0,360,240);
  c.fillStyle='#8a6a45';c.fillRect(0,45,360,195);
  for(let i=0;i<140;i++){c.fillStyle=i%3?'#6e5334':'#a78660';c.fillRect((i*53)%358,50+(i*37)%185,3,3);}
  c.fillStyle=C.w;c.fillRect(0,tb,360,30);
  c.fillStyle='#e8d9bb';c.fillRect(180-cw/2,tb-150-5,cw,155);
  c.fillStyle=C.w;c.fillRect(180-cw/2,lvl,cw,tb-lvl);
  c.strokeStyle='#2f9e44';c.lineWidth=3;c.beginPath();c.moveTo(180,45);c.lineTo(180,10);c.moveTo(180,25);c.lineTo(205,12);c.moveTo(180,32);c.lineTo(155,18);c.stroke();
  c.strokeStyle='#c9a36b';c.lineWidth=2;c.beginPath();c.moveTo(180,45);c.lineTo(180,62);c.moveTo(180,52);c.lineTo(165,66);c.moveTo(180,52);c.lineTo(195,66);c.stroke();

{d:44,h:"3-masala. Kapillyar radiusi",t:"Uchinchi masala. Suv kapillyarda 3 santimetr koʻtarildi. Kapillyar radiusini topamiz. Formuladan r teng ikki sigma boʻlinsin ro g h. Qiymatlarni qoʻyamiz: 0,144 boʻlinsin 1000 karra 10 karra 0,03. Natija 4,8 karra 10 ning minus 4-darajasi metr, taxminan 0,48 millimetr."},
{d:44,h:"4-masala. Sirt taranglik kuchi",t:"Toʻrtinchi masala: sirt taranglik kuchi. Sirt taranglik koeffitsiyenti 0,04 nyuton boʻlinsin metr, parda chegarasining uzunligi 5 santimetr. Parda ikki sirtli boʻlgani uchun F teng ikki sigma l. Ikki karra 0,04 karra 0,05 teng 0,004 nyuton, ya’ni 4 millinyuton."},
{d:44,h:"5-masala. Hoʻllash va cosθ",t:"Beshinchi masala: hoʻllash va kosinus teta. Teta 30 daraja boʻlsa, kosinus teta taxminan 0,866, musbat, demak suyuqlik hoʻllaydi, menisk botiq. Teta 140 daraja boʻlsa, kosinus taxminan minus 0,766, manfiy, demak hoʻllamaydi, menisk qavariq."},
{d:44,h:"6-masala. Tuproq kapillyari",t:"Oltinchi masala: tuproq kapillyari. Radiusi 20 mikrometr, ya’ni 2 karra 10 ning minus 5-darajasi metr. h teng 0,144 boʻlinsin 1000 karra 10 karra 2 karra 10 ning minus 5-darajasi. Maxraj 0,2. h teng 0,72 metr, ya’ni 72 santimetr. Shuning uchun mayda kapillyarli tuproqda suv yuzaga baland koʻtariladi."},
{d:21,h:"Xulosa",t:"Xulosa: h teng ikki sigma kosinus teta boʻlinsin ro g r, F teng ikki sigma l, kosinus teta ishorasi hoʻllashni belgilaydi. Eʼtiboringiz uchun rahmat!"}
];
const T0=[1,7,14,22,32];
const R=[null,
mkR(T0,[["r = 0,5 mm = 5·10⁻⁴ m",E],["σ = 0,072,  ρ = 1000,  g = 10",E],["h = 2σ / (ρ·g·r)",Y],["h = 0,144 / (1000·10·5·10⁻⁴)",Y],["h = 0,0288 m ≈ 2,9 sm",OK]]),
mkR(T0,[["σ = 0,47,  ρ = 13600,  θ = 138°",E],["cos 138° = −0,743",E],["h = 2σ·cosθ / (ρ·g·r)",Y],["h = −0,699 / 136",Y],["h ≈ −5,1 mm  (pasayadi)",OK]]),
mkR(T0,[["h = 3 sm = 0,03 m,  cosθ = 1",E],["r = 2σ / (ρ·g·h)",Y],["r = 0,144 / (1000·10·0,03)",Y],["r ≈ 4,8·10⁻⁴ m ≈ 0,48 mm",OK]]),
mkR(T0,[["σ = 0,04 N/m,  l = 5 sm = 0,05 m",E],["Parda ikki sirtli:  F = 2σ·l",Y],["F = 2·0,04·0,05",Y],["F = 0,004 N = 4 mN",OK]]),
mkR(T0,[["θ = 30°:  cos 30° ≈ 0,866 > 0",E],["→ hoʻllaydi (botiq menisk)",OK],["θ = 140°:  cos 140° ≈ −0,766 < 0",E],["→ hoʻllamaydi (qavariq menisk)",OK]]),
mkR(T0,[["r = 20 mkm = 2·10⁻⁵ m,  suv",E],["h = 2σ / (ρ·g·r)",Y],["h = 0,144 / (1000·10·2·10⁻⁵)",Y],["h = 0,144 / 0,2 = 0,72 m",Y],["h = 72 sm",OK]])];
function sceneEnter(i){}function sceneStep(i,p){}
function drop(cx,y0,R,th,cc){c.save();c.beginPath();c.rect(0,0,W,y0);c.clip();c.beginPath();c.arc(cx,y0+R*Math.cos(th*Math.PI/180),R,0,6.283);c.fillStyle=cc;c.fill();c.restore()}
function sceneDraw(i,p,lt){const t=cl((p-.1)/.8);
if(i==0){["h = 2σ·cosθ / (ρ·g·r)","F = 2σ·l","cosθ — hoʻllash ishorasi"].forEach((s,k)=>{const al=cl((lt-1-k*3)*2);if(al<=0)return;c.globalAlpha=al;rich(s,W/2,170+k*60,30,["#38bdf8","#fbbf24","#4ade80"][k]);c.globalAlpha=1})}
else if(i==1){const base=330;c.fillStyle="rgba(56,189,248,.4)";c.fillRect(40,base,520,60);tubeV(300,30,110,base+40,base-144*t,"#38bdf8",1);if(t>0)rich("h = "+fx(2.88*t)+" sm",420,base-144*t/2,22,Y);panel(R[1],lt,19)}
else if(i==2){const base=230;c.fillStyle="rgba(148,163,184,.55)";c.fillRect(40,base,520,160);tubeV(300,30,110,380,base+102*t,"#94a3b8",-1);rich("h = "+fx(-5.1*t)+" mm",430,base+60,22,Y);panel(R[2],lt,19)}
else if(i==3){const base=330;c.fillStyle="rgba(56,189,248,.4)";c.fillRect(40,base,520,60);tubeV(300,24,110,base+40,base-150*t,"#38bdf8",1);rich("h = 3 sm",400,base-80,22,Y);if(lt>20)rich("r ≈ 0,48 mm",300,100,24,OK);panel(R[3],lt,19)}
else if(i==4){const L=100,cy=200,bx=110+t*150,F=.004;c.fillStyle="rgba(56,189,248,.45)";c.fillRect(60,cy-L/2,bx-60,L);c.strokeStyle=E;c.lineWidth=3;c.beginPath();c.moveTo(300,cy-L/2);c.lineTo(60,cy-L/2);c.lineTo(60,cy+L/2);c.lineTo(300,cy+L/2);c.stroke();c.strokeStyle="#fbbf24";c.lineWidth=6;c.beginPath();c.moveTo(bx,cy-L/2);c.lineTo(bx,cy+L/2);c.stroke();arrow(bx,cy,bx-70,cy,"#f87171",4);rich("l = 5 sm",300,cy+L/2+28,18,G);rich("F = 2σ·l = "+fx(4*t)+" mN",250,330,24,Y);panel(R[4],lt,19)}
else if(i==5){const y0=300;c.fillStyle="#475569";c.fillRect(40,y0,520,14);drop(160,y0,70,30,"rgba(56,189,248,.8)");drop(420,y0,56,140,"rgba(148,163,184,.9)");rich("θ = 30°",160,350,20,OK);rich("θ = 140°",420,350,20,"#fb923c");if(lt>10)rich("hoʻllaydi",160,170,24,OK);if(lt>24)rich("hoʻllamaydi",420,170,24,"#fb923c");panel(R[5],lt,19)}
else if(i==6){const base=340;c.fillStyle="rgba(120,90,50,.55)";c.fillRect(40,base,520,50);tubeV(300,10,100,base+30,base-240*t,"#38bdf8",1);rich("h = "+fx(72*t)+" sm",420,base-240*t/2,22,Y);rich("tuproq kapillyari",300,95,16,G);panel(R[6],lt,19)}
else if(i==7)bullets(["h = 2σ·cosθ / (ρ·g·r)","F = 2σ·l  (ikki sirtli parda)","cosθ > 0 — hoʻllaydi;  cosθ < 0 — hoʻllamaydi"],lt,4,180,22)}
let acc=0;
S.forEach(s=>{s.st=acc;acc+=s.d;s.s=s.t.split(/(?<=[.!?])\s+/);const L=s.s.map(x=>x.length),tot=L.reduce((a,b)=>a+b,0);let a=0;s.cf=L.map(x=>(a+=x)/tot)});
const TOTAL=acc;
let T=0,playing=false,last=performance.now(),cur=-1,need=false,rt=1;
const SP="speechSynthesis" in window;
function sentIdx(i){const s=S[i],f=(T-s.st)/s.d;let k=0;while(k<s.cf.length-1&&f>s.cf[k])k++;return k}
function voice(){if(!SP)return null;const v=speechSynthesis.getVoices();return v.find(x=>/^uz/i.test(x.lang))||v.find(x=>/^tr/i.test(x.lang))||null}
function speak(i,from){if(!SP)return;speechSynthesis.cancel();if(!playing||$("vmu").checked)return;const v=voice(),uz=v&&/^uz/i.test(v.lang);
S[i].s.slice(from).forEach(s=>{const u=new SpeechSynthesisUtterance(uz||!v?s:s.replace(/[ʻ’‘']/g,""));u.lang=v?v.lang:"uz-UZ";if(v)u.voice=v;u.rate=rt;speechSynthesis.speak(u)})}
function note(){const v=voice();$("vnt").textContent=!SP?"Bu brauzerda ovoz yoʻq — subtitrlar koʻrsatiladi. Ovoz uchun faylni Chrome’da oching.":!v?"Qurilmada oʻzbekcha ovoz topilmadi — subtitrlar koʻrsatiladi.":/^uz/i.test(v.lang)?"Ovoz: "+v.name:"Oʻzbekcha ovoz topilmadi, "+v.name+" ishlatilmoqda (talaffuz biroz farq qilishi mumkin)."}
if(SP){speechSynthesis.onvoiceschanged=note}note();
function drawAll(i,p,lt){
const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0f1b36");g.addColorStop(1,"#020617");c.fillStyle=g;c.fillRect(0,0,W,H);
c.textAlign="center";c.fillStyle="#e2e8f0";c.font="700 28px sans-serif";c.fillText(S[i].h,W/2,48);
c.textAlign="left";c.fillStyle="#64748b";c.font="13px sans-serif";c.fillText(FOOT,16,22);c.textAlign="center";
sceneDraw(i,p,lt);
const k=sentIdx(i);c.fillStyle="rgba(2,6,23,.78)";c.fillRect(0,420,W,120);c.fillStyle="#fff";c.font="21px sans-serif";c.textAlign="center";wrap(S[i].s[k],W/2,450,880,27);
if(!playing&&T<.1){c.fillStyle="rgba(2,6,23,.7)";c.fillRect(0,0,W,H);c.fillStyle="#fff";c.font="700 34px sans-serif";c.textAlign="center";c.fillText("▶ Boshlash uchun bosing",W/2,250);c.font="20px sans-serif";c.fillStyle="#94a3b8";c.fillText(BEGIN,W/2,290)}}
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function setBtn(){$("vpp").textContent=playing?"⏸ Pauza":(T>=TOTAL?"↻ Qayta":"▶ "+(T>0?"Davom":"Boshlash"))}
function toggle(){if(T>=TOTAL){T=0;cur=-1}playing=!playing;if(playing)need=true;else if(SP)speechSynthesis.cancel();setBtn()}
$("vpp").onclick=toggle;cv.onclick=toggle;
$("vrs").onclick=()=>{T=0;cur=-1;need=true;if(SP)speechSynthesis.cancel();setBtn()};
$("vsl").oninput=e=>{T=parseFloat(e.target.value);cur=-1;need=true;if(SP)speechSynthesis.cancel()};
$("vmu").onchange=()=>{if(!$("vmu").checked)need=true;else if(SP)speechSynthesis.cancel()};
$("vrt").onchange=e=>{rt=parseFloat(e.target.value);need=true};
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;playing=false;if(SP)setTimeout(()=>speechSynthesis.cancel(),4000);setBtn()}}
let i=S.length-1;for(let k=0;k<S.length;k++)if(T<S[k].st+S[k].d){i=k;break}
if(i!==cur){cur=i;sceneEnter(i);need=true}
if(need&&playing){speak(i,sentIdx(i));need=false}
const lt=T-S[i].st,p=Math.min(1,lt/S[i].d);
if(playing)sceneStep(i,p);drawAll(i,p,lt);
$("vsl").value=T;$("vtm").textContent=fmt(T)+" / "+fmt(TOTAL);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
