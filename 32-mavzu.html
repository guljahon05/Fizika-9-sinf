<style>
:root{--bg:#f2f6fb;--card:#fff;--fg:#14213d;--mut:#5b6b85;--acc:#1e88e5;--liq:#42a5f5;--ok:#2e7d32;--bad:#c62828;--line:#d5deea}
[data-theme=dark]{--bg:#0e1621;--card:#16222f;--fg:#e8eef7;--mut:#9fb0c7;--acc:#64b5f6;--liq:#2f7fd1;--line:#2a3b4f;--ok:#66bb6a;--bad:#ef5350}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(135deg,#1565c0,#26c6da);color:#fff}
header h1{font-size:17px;margin:0;line-height:1.25}
#th{border:0;border-radius:12px;padding:10px 14px;font-size:18px;background:#ffffff33;color:#fff}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:760px;margin:auto;padding:12px}
h2{font-size:21px;margin:8px 0 12px}h3{margin:0 0 8px;font-size:17px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
.fm{font-size:19px;text-align:center;padding:12px;border-radius:12px;background:var(--bg);overflow-x:auto;font-family:Georgia,serif}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 4px}
.fr span:first-child{border-bottom:2px solid var(--fg);padding:0 6px}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctl label{display:block;margin:12px 0 2px;font-weight:600;font-size:15px}.ctl b{color:var(--acc)}
input[type=range]{width:100%;height:34px;accent-color:var(--acc)}
select,input[type=number]{width:100%;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.out{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg);font-weight:600}
.btn{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:16px;font-weight:700}
.fb{margin-top:8px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
.q{margin-bottom:16px}.q p{font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
.opt.r{background:#2e7d32;color:#fff}.opt.w{background:#c62828;color:#fff}
details{margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:12px}summary{font-weight:700;padding:6px 0}
#vcv{height:auto}
.vbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.vbar button{border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.vbar button.alt{background:var(--line);color:var(--fg)}
.vbar input[type=range]{flex:1;min-width:140px}
.vbar label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.vbar select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.vnote{font-size:13px;color:var(--mut);margin:6px 0 0}
</style></head><body>
<header><h1>32-mavzu. Ho'llash. Kapillyar hodisalar<br><small>9-sinf fizika</small></h1><button id="th" aria-label="Mavzu">🌓</button></header>
<nav id="nav"></nav><main id="main"></main>
<main id="vmain"><div class="vid" id="vid" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0"><h2>🎬 Video dars (5 daqiqa, ovozli sharh bilan)</h2>
<canvas id="vcv" width="960" height="540" aria-label="Video dars"></canvas>
<div class="vbar"><button class="" id="vpp">▶ Boshlash</button><button class=" alt" id="vrs" aria-label="Boshidan boshlash">⟲</button><input type="range" id="vsl" min="0" max="300" step="0.1" value="0" aria-label="Video vaqti"><span id="vtm">0:00 / 5:00</span></div>
<div class="vbar"><label><input type="checkbox" id="vmu"> Ovozsiz</label><label>Ovoz tezligi <select id="vrt" aria-label="Ovoz tezligi"><option value="0.85">Sekin</option><option value="1" selected>Oddiy</option><option value="1.15">Tez</option></select></label></div>
<p class="vnote" id="vnt"></p></div></main>
<script>
const g=9.8,$=s=>document.querySelector(s);let C={},DT=.016,cur=0;
const fr=(n,d)=>`<span class=fr><span>${n}</span><span>${d}</span></span>`;
const hmm=(s,cs,rho,r)=>2e6*s*cs/(rho*g*r);
const cl=(a,l,h)=>Math.min(h,Math.max(l,a));
function cols(){const s=getComputedStyle(document.documentElement);['fg','liq','acc','mut','line','card'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
function mol(x,a,b,r,c){x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.strokeStyle=C.fg;x.lineWidth=1;x.stroke()}
function arr(x,x1,y1,x2,y2,c,w=2){x.strokeStyle=x.fillStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));x.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));x.fill();x.lineWidth=1}
function txt(x,s,a,b,sz=14,c){x.fillStyle=c||C.fg;x.font=`600 ${sz}px system-ui`;x.fillText(s,a,b)}
function water(x,y,h){x.globalAlpha=.35;x.fillStyle=C.liq;x.fillRect(0,y,360,h);x.globalAlpha=1}
function cap(x,c,y0,th,col){th=cl(th,.32,Math.PI);const cs=Math.min(Math.cos(th),.95),R=42*Math.cbrt(2/((2+cs)*(1-cs)**2)),cy=y0+R*cs;x.beginPath();for(let p=-th;p<=th;p+=.05){const px=c+R*Math.sin(p),py=cy-R*Math.cos(p);p==-th?x.moveTo(px,py):x.lineTo(px,py)}x.closePath();x.fillStyle=col;x.fill();x.strokeStyle=C.fg;x.stroke()}
function mens(x,cx,hw,top,bot,lvl,cs,col){const pts=[];for(let u=-1;u<=1.001;u+=.1)pts.push([cx+u*hw,lvl-26*cs*u*u]);x.beginPath();x.moveTo(cx-hw,bot);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(cx+hw,bot);x.closePath();x.fillStyle=col;x.fill();x.strokeStyle=C.fg;x.lineWidth=2;x.beginPath();x.moveTo(cx-hw,top);x.lineTo(cx-hw,bot);x.lineTo(cx+hw,bot);x.lineTo(cx+hw,top);x.stroke();x.lineWidth=1}
function tube(x,cx,w,yL,hp,col,top,bot){const ly=yL-hp;x.fillStyle=C.card;x.fillRect(cx-w/2,top,w,bot-top);x.fillStyle=col;x.fillRect(cx-w/2,ly,w,bot-ly);x.strokeStyle=C.fg;x.lineWidth=2;x.strokeRect(cx-w/2,top,w,bot-top);x.lineWidth=1}
const LQ=[{n:'Suv',s:.072,r:1000,c:'#42a5f5'},{n:'Simob',s:.47,r:13600,c:'#9e9e9e'},{n:'Spirt',s:.022,r:800,c:'#ffb74d'}];
const TH=[[10,140,5],[105,150,20]]; /* [idish][suyuqlik] */
const sol=(a,b,c,d)=>`<b>Berilgan:</b> ${a}<br><b>Topish kerak:</b> ${b}<br><b>Yechim:</b> ${c}<br><b>Javob:</b> ${d}`;

const P=[
{t:"Suyuqlik sirtidagi molekulyar kuchlar",
th:"<b>Kogeziya</b> — bir xil modda molekulalarining o'zaro tortishishi. <b>Adgeziya</b> — turli moddalar molekulalarining tortishishi. Suyuqlik ichidagi molekulaga qo'shni molekulalar hamma tomondan tortadi, natijaviy kuch nolga teng. Sirt qatlamidagi molekulani esa faqat pastdagi va yon tomondagilar tortadi, shuning uchun natijaviy kuch <b>suyuqlik ichiga</b> yo'nalgan. Shu sababli sirt tarang parda kabi qisqarishga intiladi — bu <b>sirt taranglik</b>.",
fm:"σ = "+fr("F","l")+" &nbsp; (N/m)",
ex:"Suv tomchisi sharsimon shaklga intiladi (sirt eng kichik bo'lishi uchun). Shishadagi simob ham mayda sharchalarga bo'linadi.",
sim:{c:[{id:'k',l:'Kogeziya kuchi',min:.5,max:2,step:.1,val:1}],d(x,v){water(x,100,140);x.strokeStyle=C.acc;x.beginPath();x.moveTo(0,100);x.lineTo(360,100);x.stroke();
const M=(cx,cy,half)=>{for(let i=0;i<6;i++){const a=i*Math.PI/3,s=Math.sin(a);if(half&&s<-.01)continue;mol(x,cx+Math.cos(a)*30,cy+s*30,6,C.liq);arr(x,cx,cy,cx+Math.cos(a)*(14+10*v.k),cy+s*(14+10*v.k),C.mut,2)}mol(x,cx,cy,8,C.acc)};
M(95,175,0);M(265,100,1);arr(x,265,100,265,100+22+22*v.k,'#e53935',4);
txt(x,'Ichkarida: F = 0',30,222);txt(x,'Sirtda: F ↓',215,60);txt(x,'(ichkariga)',222,78);return`Sirtdagi natijaviy kuch ichkariga yo'nalgan; kogeziya ${v.k.toFixed(1)} marta → kuch kattaroq.`}},
an(x,t,S){S.m=S.m||Array.from({length:30},()=>({x:Math.random()*340+10,y:125+Math.random()*100,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60}));water(x,110,130);x.strokeStyle=C.acc;x.beginPath();x.moveTo(0,110);x.lineTo(360,110);x.stroke();
S.m.forEach((m,i)=>{m.x+=m.vx*DT;m.y+=m.vy*DT;if(m.x<8||m.x>352)m.vx*=-1;if(m.y<114||m.y>232)m.vy*=-1;m.x=cl(m.x,8,352);m.y=cl(m.y,114,232);mol(x,m.x,m.y,7,C.acc);if(m.y<135)arr(x,m.x,m.y+9,m.x,m.y+20+7*Math.sin(t*3+i),'#e53935',2)});txt(x,'Sirtga yaqin molekulalar ichkariga tortiladi',8,98,13)},
pr:{q:"Suv pardasi chegarasining uzunligi l = 2 cm = 0,02 m, σ = 0,072 N/m. Sirt taranglik kuchi F necha mN (F = σ·l)?",a:1.44,u:"mN",s:sol("σ = 0,072 N/m; l = 0,02 m","F","F = σ·l = 0,072·0,02 = 0,00144 N","F = 1,44 mN")}},

{t:"Ho'llash va ho'llamaslik",
th:"Adgeziya kuchi kogeziyadan <b>katta</b> bo'lsa, suyuqlik qattiq jismni <b>ho'llaydi</b> (suv–shisha) va sirt bo'ylab yoyiladi. Adgeziya kogeziyadan <b>kichik</b> bo'lsa, <b>ho'llamaydi</b> (simob–shisha, suv–mum) va tomchi sharsimon bo'lib dumalaydi.",
fm:"F<sub>adg</sub> &gt; F<sub>kog</sub> → ho'llaydi<br>F<sub>adg</sub> &lt; F<sub>kog</sub> → ho'llamaydi",
ex:"Yog'langan qush patlari suvni ho'llamaydi — suv tomchilari dumalab tushadi. Kir yuvishda suvning kirni ho'llashi muhim. Suv o'tkazmaydigan matolar maxsus qoplama bilan ho'llanmaydigan qilinadi.",
sim:{c:[{id:'r',l:'Adgeziya / kogeziya nisbati',min:.3,max:2,step:.05,val:1.5}],d(x,v){x.fillStyle=C.mut;x.globalAlpha=.4;x.fillRect(0,190,360,50);x.globalAlpha=1;const th=Math.acos(cl((v.r-1)*1.5,-1,1));cap(x,180,190,th,C.liq);return`θ ≈ ${Math.round(th*180/Math.PI)}° — ${th<Math.PI/2?"ho'llaydi (tomchi yoyiladi)":th>Math.PI/2?"ho'llamaydi (tomchi sharsimon)":"chegara holat"}`}},
an(x,t,S){const q=t%6;x.fillStyle=C.mut;x.globalAlpha=.4;x.fillRect(0,190,360,50);x.globalAlpha=1;
[[90,35],[270,140]].forEach(([c,d],k)=>{if(q<1){const y=20+156*q*q;mol(x,c,y,14,C.liq)}else{const p=cl((q-1)/1.2,0,1),e=p*p*(3-2*p),th=Math.PI+(d*Math.PI/180-Math.PI)*e;let cx=c;if(k&&q>2.6)cx=c+(q-2.6)*45;cap(x,cx,190,th,C.liq)}});
txt(x,"Shisha: yoyiladi",25,225,13);txt(x,"Mum: dumalaydi",205,225,13)},
pr:{q:"Suv tomchisi shisha bilan θ = 40° burchak hosil qildi. cosθ ni toping (2 xona aniqlikda).",a:.77,u:"",s:sol("θ = 40°","cosθ","cos 40° ≈ 0,766","≈ 0,77 (θ&lt;90° — ho'llaydi)")}},

{t:"Menisk va chegaraviy burchak",
th:"Idish devori yonida suyuqlik sirti egilgan bo'ladi — bu <b>menisk</b>. Ho'llovchi suyuqlikda menisk <b>botiq</b>, ho'llamaydigan suyuqlikda <b>qavariq</b>. Suyuqlik sirtiga o'tkazilgan urinma bilan devor orasidagi (suyuqlik tomonidagi) burchak <b>chegaraviy burchak θ</b> deyiladi. θ &lt; 90° — ho'llash, θ &gt; 90° — ho'llamaslik.",
fm:"θ &lt; 90° ⇒ cosθ &gt; 0 (botiq menisk)<br>θ &gt; 90° ⇒ cosθ &lt; 0 (qavariq menisk)",
ex:"O'lchov silindrida suvning meniski botiq, simobniki qavariq. Hajmni o'qiyotganda ko'z menisk sathida bo'lishi kerak: suvda pastki chizig'i, simobda yuqori chizig'i bo'yicha o'qiladi.",
sim:{c:[{id:'l',t:'s',l:'Suyuqlik',o:['Suv','Simob','Spirt']},{id:'m',t:'s',l:'Idish materiali',o:['Shisha','Plastik (yog\'li)']}],d(x,v){const th=TH[v.m][v.l],cs=Math.cos(th*Math.PI/180);mens(x,180,60,20,225,120,cs,LQ[v.l].c);txt(x,'θ = '+th+'°',250,60,18,C.acc);return`${LQ[v.l].n}: θ = ${th}° — ${th<90?"ho'llaydi, menisk botiq":"ho'llamaydi, menisk qavariq"}`}},
an(x,t,S){const p=cl((t%7)/5,0,1),lv=215-150*p;if(p<1){x.fillStyle=C.liq;x.fillRect(178,10,4,lv-10)}mens(x,180,32,20,225,lv,.95*cl(p*3,0,1),C.liq);txt(x,'Probirkaga suv quyilmoqda',90,16,13)},
pr:{q:"Simobning shisha bilan chegaraviy burchagi 140°. U 90° dan necha gradusga katta?",a:50,u:"°",s:sol("θ = 140°","θ − 90°","140° − 90° = 50°","50° (θ&gt;90° — ho'llamaydi)")}},

{t:"Kapillyar hodisalar",
th:"<b>Kapillyar</b> — juda ingichka naycha. Ho'llovchi suyuqlik (suv–shisha) kapillyarda tashqi sathdan <b>yuqoriga ko'tariladi</b>, ho'llamaydigan suyuqlik (simob–shisha) <b>pastga tushadi</b>. Naycha qancha ingichka bo'lsa, ko'tarilish (pasayish) shuncha katta.",
fm:"h ∼ "+fr("1","r"),
ex:"Sochiq va salfetka suvni kapillyar shimadi. Qand bo'lagining chetini choyga tegizsangiz, butun bo'lak ho'llanadi.",
sim:{c:[{id:'q',t:'s',l:'Suyuqlik',o:['Suv','Simob']},{id:'r',l:'Naycha radiusi r (mm)',min:.2,max:1,step:.05,val:.4}],d(x,v){const L=LQ[v.q],cs=v.q?-.766:1,yL=200;x.fillStyle=L.c;x.fillRect(0,yL,360,40);const rs=[v.r,2*v.r,3*v.r],xs=[70,180,290];let s='';rs.forEach((r,i)=>{const h=hmm(L.s,cs,L.r,r);tube(x,xs[i],6+r*14,yL,h*2,L.c,20,235);s+=`r=${r.toFixed(2)} mm: h=${h.toFixed(1)} mm; `});return s},},
an(x,t,S){const p=cl((t%6)/4,0,1),e=p*p*(3-2*p),yL=190;[[0,170,'#42a5f5',1,[.3,.8],[50,110]],[190,360,'#9e9e9e',-.766,[.3,.8],[240,300]]].forEach(([a,b,c,cs,rs,xs])=>{x.fillStyle=c;x.fillRect(a,yL,b-a,50);const L=cs>0?LQ[0]:LQ[1];rs.forEach((r,i)=>tube(x,xs[i],6+r*14,yL,hmm(L.s,cs,L.r,r)*2*e,c,20,235))});txt(x,'Suv ↑',60,14);txt(x,'Simob ↓',250,14)},
pr:{q:"r = 1 mm radiusli kapillyarda suv h = 14,7 mm ko'tarildi. r = 0,25 mm bo'lsa, h necha mm bo'ladi (h ∼ 1/r)?",a:58.8,u:"mm",s:sol("r₁ = 1 mm; h₁ = 14,7 mm; r₂ = 0,25 mm","h₂","r 4 marta kichik → h 4 marta katta: h₂ = 14,7·4","h₂ = 58,8 mm")}},

{t:"Kapillyar ko'tarilish balandligi formulasi",
th:"Kapillyardagi suyuqlik ustunining og'irligi sirt taranglik kuchi bilan muvozanatlashadi. Bundan: h <b>σ ga to'g'ri</b>, ρ va r ga <b>teskari</b> proporsional. Ho'llovchi suyuqlikda (θ ≈ 0) cosθ ≈ 1. Ho'llamaydigan suyuqlikda cosθ &lt; 0, h manfiy — suyuqlik pasayadi.",
fm:"h = "+fr("2σ·cosθ","ρ·g·r")+"<br><small>σ — sirt taranglik (N/m), ρ — zichlik (kg/m³), g = 9,8 m/s², r — radius (m)</small><br>h ∝ 1/r &nbsp; h ∝ σ &nbsp; h ∝ 1/ρ",
ex:"<b>Misol.</b> Suv, r = 0,5 mm = 5·10⁻⁴ m, σ = 0,072 N/m, ρ = 1000 kg/m³, cosθ = 1.<br>h = "+fr("2·0,072","1000·9,8·5·10⁻⁴")+" = "+fr("0,144","4,9")+" ≈ 0,0294 m ≈ <b>29,4 mm</b>",
sim:{c:[{id:'r',l:'r (mm)',min:.1,max:2,step:.05,val:.5},{id:'s',l:'σ (N/m)',min:.02,max:.08,step:.002,val:.072},{id:'p',l:'ρ (kg/m³)',min:700,max:1400,step:10,val:1000}],d(x,v){const h=hmm(v.s,1,v.p,v.r),hp=Math.min(h*.9,200),yL=225;x.fillStyle=C.liq;x.fillRect(0,yL,170,15);tube(x,80,6+v.r*14,yL,hp,C.liq,10,240);
const X=a=>195+(a-.1)/1.9*150,Y=b=>200-cl(b,0,250)/250*180;x.strokeStyle=C.fg;x.beginPath();x.moveTo(195,15);x.lineTo(195,200);x.lineTo(350,200);x.stroke();txt(x,'h',180,22,12);txt(x,'r',340,215,12);x.strokeStyle=C.acc;x.lineWidth=2;x.beginPath();for(let r=.1;r<=2.001;r+=.05){const y=Y(hmm(v.s,1,v.p,r));r<.11?x.moveTo(X(r),y):x.lineTo(X(r),y)}x.stroke();x.lineWidth=1;mol(x,X(v.r),Y(h),6,'#e53935');return`h = 2σ/(ρgr) = ${h.toFixed(1)} mm`}},
an(x,t,S){const r=.25+.9*(.5+.5*Math.sin(t*.8)),h=hmm(.072,1,1000,r),yL=225;x.fillStyle=C.liq;x.fillRect(0,yL,360,15);tube(x,120,6+r*14,yL,Math.min(h*.9,200),C.liq,10,240);txt(x,'r = '+r.toFixed(2)+' mm',200,80,18,C.acc);txt(x,'h = '+h.toFixed(1)+' mm',200,115,18);txt(x,'r kamaysa — h ortadi',200,150,13)},
pr:{q:"Suv (σ = 0,072 N/m, ρ = 1000 kg/m³), r = 0,2 mm, cosθ = 1. h necha mm ko'tariladi (g = 9,8 m/s²)?",a:73.5,u:"mm",s:sol("σ=0,072 N/m; ρ=1000 kg/m³; r=2·10⁻⁴ m","h","h = 2σ/(ρgr) = 0,144/(1000·9,8·2·10⁻⁴) = 0,144/1,96 ≈ 0,0735 m","h ≈ 73,5 mm")}},

{t:"Tabiat va texnikada kapillyar hodisalar, masalalar",
th:"O'simlik ildizidan suv poyaga kapillyarlar orqali ko'tariladi. Tuproqda suv kapillyar yo'llar bilan yuzaga chiqib bug'lanadi: <b>shudgorlash</b> kapillyarlarni buzadi, <b>mulchalash</b> bug'lanishni kamaytiradi — namlik saqlanadi. Qurilishda devor poydevordan suv shimadi — <b>gidroizolyatsiya</b> (suv o'tkazmaydigan qatlam) qo'yiladi. Qalam, sham va moy lampa fitili suyuqlikni kapillyar ko'taradi. Suv o'tkazmaydigan matolar ho'llanmaydigan qoplama bilan ishlanadi.",

ex:"Mayda zarrali zich tuproqda kapillyarlar ingichka — suv baland ko'tariladi, lekin sekin. G'ovak tuproqda kapillyarlar keng — suv kam ko'tariladi.",
